name: CI

# Runs the test suite and a production build on every pull request, so a PR's
# "mergeable" badge means "verified", not just "no merge conflict". Before this
# workflow existed the repo had no CI at all: `gh pr checks` reported "no checks
# reported" for every open PR, and main sat red (a missing `fake-indexeddb`
# devDependency) without anything noticing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref; a new push supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Root vitest also picks up the workspace packages (e.g. telegram-bridge).
      - name: Unit tests
        run: npm test
      # Mirrors deploy.yml's build so a PR cannot break Pages after it merges.
      - name: Production build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # main is lint-clean as of the change that added this comment, so this job
    # now blocks. It was previously non-blocking because two pre-existing errors
    # on main (an intentional NUL sentinel regex in telegramFormat.js, and a
    # leftover unused import in App.jsx) made it red on every PR — a permanently
    # failing check that everyone learned to ignore. Both are fixed; keeping the
    # job blocking is what stops them coming back.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # The browser slot table (GH #180) lives in ONE place -- `## Browser slots` in
  # user-settings.md -- and is read by ONE parser. Before this job existed, the
  # only thing standing between that table and three scripts quietly re-encoding
  # a stale copy of it was a nightly check that runs on one laptop. A guard that
  # only runs where the drift happens cannot stop the drift from merging.
  #
  # The parser and its mutation check are pure text work, so they run on the
  # Linux runner. The arms that need a real browser or the live settings file
  # (F and G) self-skip; the parser arms (A-D), the mutants (M1-M4) and the
  # check-browser-slots integration (E) all run here.
  browser-slots:
    name: Browser slot table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (one table, one reader)
        shell: pwsh
        run: ./plugins/overnight-agent/checks/mutcheck-browser-slots.ps1

  # PHASE 0's mandated inbox check (GH #346) is the user's out-of-band channel into an
  # overnight run, and its old implementation could not fail: a search on an unhealthy
  # email client returns `[]`, which is byte-identical to a genuinely empty mailbox. This
  # guard pins the distinction -- its arms D and E send the SAME `[]` payload and must
  # produce OPPOSITE verdicts -- and proves each guard load-bearing by mutation.
  #
  # It runs against node fixtures standing in for the MCP prober, in a temp dir, and never
  # touches a real mailbox or the planner folder, so it runs unmodified on the Linux
  # runner. Same reasoning as the two jobs above: a guard that only runs on the one laptop
  # where the drift happens cannot stop the drift from merging.
  inbox-check:
    name: Inbox check guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capability manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('plugins/overnight-agent/skills/overnight-agent/run-capabilities.json','utf8'))"
      - name: Mutation check (an unreadable inbox is not an empty one)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-inbox-check.ps1

  # A truncated Google Tasks read must not read as a small backlog (GH #524).
  # The Tasks API silently caps a bare list_tasks at a 20-item first page, and a
  # short page is byte-identical to a short backlog -- so a run read 9 open tasks
  # and reported a burn-down from 35, while all 35 were still open.
  #
  # This runs on ubuntu-latest like the other guards: the mutation check drives a
  # node fixture in a temp dir that emulates the API's paging semantics, so it
  # never touches a real Google account, the Google Workspace MCP, or the planner
  # folder. It is pure-PowerShell + node and platform-independent by construction.
  google-tasks-check:
    name: Google Tasks collect guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mutation check (a truncated read is not a short backlog)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-google-tasks.ps1

  # A worktree teardown must not empty the shared node_modules (GH #321).
  # `git worktree remove --force` deletes THROUGH a directory junction, so the
  # documented "junction node_modules into the worktree" trick made routine
  # cleanup wipe the dependencies of the main checkout and every sibling worktree
  # at once -- exit code 0, no warning, and the damage surfacing later in an
  # unrelated session as a missing binary.
  #
  # This job runs on windows-latest and nowhere else, because a junction is an
  # NTFS reparse point: on Linux the hazard cannot be reproduced, and a guard that
  # has never run where the failure happens is not a guard yet.
  #
  # The hazard is ALSO git-version-dependent -- measured: 2.53.0.windows.4 deletes
  # through, 2.54.0.windows.1 and the runner's 2.55.0.windows.5 do not -- so the
  # check probes for it and reports the arms it could not exercise as `skip`,
  # never as `ok`. On this runner that means the guards' own behaviour is pinned
  # here and the destructive arms are pinned on the affected machine.
  #
  # The check builds its own git repos, fake shared installs and real junctions
  # under a temp directory; it touches no real checkout.
  worktree-safety:
    name: Worktree teardown guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (unlink before remove, verify the target survived)
        shell: pwsh
        run: ./scripts/mutcheck-worktree-safety.ps1
      # The other half of the same lifecycle (GH #452). Teardown removes the workspace and knows
      # nothing about session bindings, so a torn-down worktree left its binding reporting
      # `reuse, live` at an empty directory -- the next run told to resume a workspace with no
      # repository in it. Measured on task #466. The verdict now verifies its own workspace, and
      # fails OPEN: a path it cannot inspect is never called dead, because discarding a live
      # session's continuity is the expensive direction.
      - name: Mutation check (the session verdict verifies its workspace)
        shell: pwsh
        run: ./plugins/overnight-agent/checks/mutcheck-workspace-verdict.ps1

  # The read-path budget guard (GH #292/#293) is what stops an every-run file growing
  # until it eats the context window -- the defect that made runs stop finishing. Its
  # mutation check proves those guards are load-bearing, but until now it ran only on
  # the nightly laptop, which is the same gap the job above was created to close: a
  # guard that only runs where the drift happens cannot stop the drift from merging.
  #
  # It is pure text work against synthetic fixtures in a temp dir -- it never reads the
  # real planner folder -- so it runs unmodified on the Linux runner.
  read-path-budget:
    name: Read-path budget guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mutation check (budgets, growth, collapse, off-path classification)
        run: node ./plugins/overnight-agent/checks/mutcheck-read-path-budget.mjs
      - name: Manifest and baseline are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('plugins/overnight-agent/checks/read-path-manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/overnight-agent/checks/read-path-baseline.json','utf8'))"
      - name: Declared patterns compile
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('plugins/overnight-agent/checks/read-path-manifest.json','utf8'));
            for (const f of m.files) {
              for (const k of ['idPattern','strayPattern']) {
                if (f[k]) { new RegExp(f[k]); console.log(k + ' ok for ' + f.id); }
              }
            }
          "

  # The linked-task pointer (GH #408). SKILL.md mandates an upstream walk before planning
  # anything and names `extract` as the tool for it, so `linked: (none)` is not a cosmetic
  # line -- it is the signal that decides whether the walk happens at all. It used to read
  # only the journal, so a task whose parent was recorded on the BOARD reported "no parent"
  # and the walk was skipped on the tool's own authority, silently.
  #
  # Runs here rather than only on the nightly laptop for the same reason the two jobs above
  # do: a guard that only runs where the drift happens cannot stop the drift from merging.
  # It is pure text work against synthetic fixtures in a temp dir -- it never reads the real
  # planner folder -- so it runs unmodified on the Linux runner under pwsh.
  board-linked-pointer:
    name: Linked-task pointer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (board + journal merged, gaps reported)
        shell: pwsh
        run: ./plugins/overnight-agent/checks/mutcheck-board-linked.ps1

  # installed-skill-drift-sweep is what stops the agent running code that exists on no merged
  # ref (GH #398). Its mutation check has always existed but ran ONLY on the nightly laptop,
  # against the copy in %LOCALAPPDATA% -- the same gap the three jobs above were created to
  # close: a guard that only runs where the drift happens cannot stop the drift from merging.
  #
  # It also now carries the BUDGET arms. That matters more than usual here, because the cost
  # regression #398 fixed (429 s per invocation, twice per deploy, in PHASE 0 of a */30 job)
  # was invisible to every verdict assertion -- the sweep was perfectly correct and unusably
  # slow at the same time. T_SPAWN_INVARIANT and T_NO_CROSS_PRODUCT are the only things that
  # would catch it coming back, so they belong where merges are gated.
  #
  # Pure text work against synthetic git repos in a temp dir -- it never reads the real
  # installed plugin -- so OA_SWEEP points it at the repo copy and it runs on the Linux runner.
  installed-skill-drift:
    name: Installed-skill drift sweep guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mutation check (4 guards + spawn/query budget + blob-id parity)
        env:
          OA_SWEEP: ./plugins/overnight-agent/checks/installed-skill-drift-sweep.mjs
        run: node ./plugins/overnight-agent/checks/mutcheck-installed-skill-drift.mjs

  # The durable task -> catch-up-doc binding (GH #423), prerequisite for #421/#424/#425.
  #
  # Before this, the one catch-up doc that existed was located by TITLE SEARCH. That fails in
  # three ways that are all SILENT and all end in the same place -- a second document, with the
  # user's comments stranded on the first: a renamed doc becomes invisible, task ids are reusable
  # after completion (#132), and "found nothing" is indistinguishable from "found the wrong one".
  #
  # Two arms carry the weight. D asserts that binding a different doc over an existing one is
  # REFUSED rather than silently applied; K/O assert that losing %LOCALAPPDATA% -- which is
  # explicitly not synced -- rebinds from the journal stamp instead of reporting "unbound", the
  # value that would make a caller create the duplicate.
  #
  # Runs here rather than only on the nightly laptop, for the reason the jobs above give: a guard
  # that only runs where the drift happens cannot stop the drift from merging. It is pure text
  # work against synthetic journals in a temp dir -- it never reads the real planner folder, and
  # every path into it is passed explicitly -- so it runs unmodified on the Linux runner.
  doc-binding:
    name: Catch-up doc binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (exact binding, exactly-once watermark, self-healing)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-doc-binding.ps1

  # Changing a poll/recheck cadence must not make a task MORE aggressive (GH #506).
  #
  # Measured live 2026-09-04: moving task 468 from a 2h poll to 6h -- done deliberately to stop it
  # holding the only dispatch slot while blocked -- set next_due to the current minute, so "poll me
  # less" meant "poll me now". At concurrency 1 a due poll outranks the awaiting_reply park in
  # Test-SessionHoldsCapacity, so the one-call form of the relief consumed the slot it was meant to
  # free and re-qualified the task to hold the Today gate.
  #
  # It runs here rather than as a note because the hazard was first written into agent-lore.md,
  # which is GH #454: 903 KB, 160 headings, zero readers. A hazard recorded where nothing reads it
  # does not stop the next occurrence. Hermetic -- its own temp state dir and journals, never the
  # real planner folder -- so it runs unmodified on the Linux runner.
  cadence-rearm:
    name: Cadence re-arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (lengthening a cadence must not make it due now)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-cadence-rearm.ps1

  # Only the USER closes a task, and an unanswered message survives a re-snapshot (GH #501).
  #
  # Two defects, one root cause, and both were measured on the live board on 2026-09-04. Task #245
  # was row 1 of `## Today` in planner.md and absent from planner-completed.md -- the user had never
  # completed it -- but the AGENT had marked it `done` on 2026-08-31. That self-declared status was
  # read as though the user had closed the task, so three of Shiv's messages (new requirements, a new
  # link, a new question) sat unanswered under the turn-end stamp for over a day, and the released
  # Today gate sent the run to Deferred row 68 instead. He noticed before the machinery did:
  # "245 is on my today list and it doesn't seem like it's getting picked up."
  #
  # The compensating control the design leans on -- "a missed nudge STAYS VISIBLE as
  # reopened_closed" -- was defeated by an `oa-state mark` 62 seconds after the messages landed,
  # which re-snapshotted the journal and set `changed` and `reopened_closed` both false. The nudge
  # was not missed; it was erased.
  #
  # Both guards run here because they cover DIFFERENT halves and neither can see the other's hole:
  # mutcheck-reopened-closed proves the #170 rule still holds for work the user really did close
  # (and it had never run in CI at all), while mutcheck-agent-declared-done reproduces #245 exactly
  # -- agent `done`, Today row, three `<!-- from: me -->` messages after the turn-end stamp, and the
  # `mark` applied AFTER the fold -- and asserts the task is offered rather than silent.
  #
  # Hermetic: each builds its own board, completed board, journals and state dir under TEMP, so
  # nothing here touches the real planner folder and both run unmodified on the Linux runner.
  agent-declared-done:
    name: Only the user closes a task
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (a reply on work the USER closed is reported, never worked)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-reopened-closed.ps1
      - name: Mutation check (#245 -- an agent-declared done must not swallow his messages)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-agent-declared-done.ps1
      - name: Sibling-skill reopen fixtures still pass
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/oa-state.Tests.ps1

  # The catch-up doc skill and Shiv's four doc preferences (GH #441).
  #
  # The preferences used to live in three places -- SKILL.md prose, a skill folder outside the
  # repo, and one task journal's operating contract -- so they were re-derived per run and a new
  # machine picked up none of them. They now ship inside the plugin.
  #
  # Two things silently undo that, and neither surfaces as a failure anywhere else: a preference
  # disappearing (or being left as an empty cell, so it is still "documented" while saying
  # nothing), and the skill moving out of the directory plugin.json globs -- which stops it being
  # discovered and deployed at all. That second one is the merged-but-not-running failure this
  # repo has already paid for twice, so it is asserted rather than assumed.
  #
  # Pure text work against copies in a temp dir; it never reads the real planner folder, so it
  # runs unmodified on the Linux runner.
  catchup-doc-prefs:
    name: Catch-up doc preferences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (preferences present, skill inside the deployed glob)
        shell: pwsh
        run: ./plugins/overnight-agent/checks/mutcheck-catchup-doc-prefs.ps1

  # Comment and body provenance, on both surfaces the agent speaks through (GH #422, #453, #456).
  #
  # The agent posts through Shiv's identity on Google Docs AND on GitHub, so on neither surface
  # does the API's author field distinguish the two of them. The surfaces then need OPPOSITE
  # invariants, which is why both guards run here rather than one standing in for the other:
  #
  #   Docs   the agent never posts  -> every comment is provably Shiv's
  #   GitHub the agent always stamps -> exactly one comment is provably the agent's
  #
  # GitHub is the destructive half. The contract says "edit the one agentic comment in place",
  # and until #453 that comment was identified only by there happening to be exactly one -- so
  # the first time Shiv commented, an edit could overwrite his words.
  #
  # Issue BODIES (#456) need a different fix again: both writers there are legitimately the agent,
  # so a marker cannot separate them and the answer is a precondition. `gh issue edit --body` is
  # an unconditional whole-document overwrite -- and its own sibling flags (--add-label, and the
  # rest) are all additive, so the destructive shape is chosen rather than imposed.
  #
  # `mutcheck-doc-comments.mjs` predates this job and was running nowhere: it shipped as a guard,
  # was extended by PR #451, and no workflow ever invoked it. That is this repo's own
  # merged-but-not-running failure applied to a reliability check, so it is wired up here.
  #
  # Pure in-memory fixtures; none of them reads the planner folder or calls a network API.
  comment-provenance:
    name: Comment provenance (Docs + GitHub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (Docs — attribution, and the never-comment invariant)
        run: node ./plugins/overnight-agent/checks/mutcheck-doc-comments.mjs
      - name: Mutation check (GitHub — stamp, resolve by marker, refuse to edit unmarked)
        run: node ./plugins/overnight-agent/checks/mutcheck-issue-comments.mjs
      - name: Mutation check (GitHub — issue bodies refuse to overwrite a moved document)
        run: node ./plugins/overnight-agent/checks/mutcheck-issue-body.mjs

  # The board's ragged rows (GH #426). `## Deferred` carries a `Wake` column that
  # `## Today` does not, so a hand-edited or pre-#307 row has one field too few --
  # and the reader indexed `Linked ID` off the RAW row, so `cells[6]` on a 6-field
  # row was `undefined` and the link silently vanished from the UI. #307 fixed the
  # writer; this is the reader half, and the two now share one alignment rule so
  # they cannot drift apart again.
  #
  # It runs here because the arms span four files (boardRow, boardTable, snooze,
  # App.jsx) -- a check that could only mutate one of them reported green while the
  # bug was live, which is exactly how #426 survived #307. Pure text work against
  # in-memory fixtures; it never reads the real planner folder.
  ragged-rows:
    name: Ragged board rows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mutation check (one alignment rule, reader agrees with writer)
        run: node ./scripts/mutcheck-ragged-row.mjs

  # The pointer turn (GH #425) -- the journal half of #424. Once a task has a catch-up doc, a
  # new journal turn is a POINTER to it: status, doc link, a sentence or two, the ask. The
  # narrative is amended into the doc instead of being restated on every wake (agent turns on
  # task 468 averaged 5,305 chars across 28 turns; the corpus is 395 journals / 5.36 MB, and
  # journals sit on the per-run read path -- #291).
  #
  # It runs here, and not only on the nightly laptop, because the two arms that matter cross
  # component boundaries that no single-file check can see. G writes a real turn with the real
  # write-turn.ps1 and then reads the ask back out with the real journal.js + digest.js, which
  # is the Telegram approval digest's own code path; H runs the real oa-state.ps1 and asserts
  # `reopened` flips from false to true for a reply typed under the shortened turn. Those are
  # the two acceptance criteria a "just write less" change breaks silently, and both live in a
  # different file from the one being changed.
  #
  # Needs node as well as pwsh for arm G. Pure text work against synthetic journals in a temp
  # dir with an isolated -JournalDir/-StateDir; it never reads the real planner folder.
  pointer-turn:
    name: Pointer journal turn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mutation check (size ceiling, the pointer points, the ask stays)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-pointer-turn.ps1

  # The doc comment channel is actually READ (GH #421). #422/#423/#424/#425 each shipped a
  # primitive for the catch-up doc and a guard for that primitive. None of them asserts a run
  # ever CALLS one -- and measured on the live state store the day after the binding shipped,
  # the only doc-bound task had `doc.observed_at ""`. `-Observe` had never run once, so a
  # comment on the doc Shiv was told is "the primary communication mechanism" reached nothing,
  # and `scan` reported 0 new comments whether the channel was empty or unreadable. Identical
  # bytes for both, which is #346's defect in a third surface.
  #
  # It runs here rather than only on the nightly laptop for the reason #398's guard was moved
  # here: a guard that only runs on the one machine where the drift happens cannot stop the
  # drift from merging -- and this one's whole subject is a step that gets silently skipped.
  #
  # Pure text work against a synthetic planner folder and state dir in a temp dir. OA_SWEEP
  # points it at the repo copy and OA_STATE_DIR is passed into every child, so it never reads
  # the real planner folder and never touches LOCALAPPDATA -- which is what makes it run
  # unmodified on the Linux runner (#425's job went red on exactly that assumption).
  catchup-doc-channel:
    name: Catch-up doc comment channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mutation check (unread channel detected, healthy loop stays quiet)
        env:
          OA_SWEEP: ./plugins/overnight-agent/checks/catchup-doc-sweep.mjs
        run: node ./plugins/overnight-agent/checks/mutcheck-catchup-doc.mjs

  # The per-task session (GH #404). The overnight agent used to do task work IN THE RUN SESSION --
  # measured live on task #451: it read the journal, edited four deliverables and wrote the turn
  # without ever leaving the main session. #391 already stated the rule ("one task, one workspace,
  # one thing being verified at a time") but stated it about a mechanism that did not exist.
  #
  # Three arms carry the weight, and all three guard a SILENT bypass. D asserts that a second
  # session cannot be bound over a live one, which is what makes "reuse the persisted session" a
  # rule rather than an intention. I and J assert the two halves of the inheritance trap: every
  # session API defaults the project to the CALLER's, so a per-task session created without naming
  # a project lands in the run session's project, sharing the run session's workspace -- the exact
  # isolation failure the issue exists to prevent, reintroduced by the delegation step itself. That
  # was not hypothetical; it happened on the first attempt to delegate this very issue.
  #
  # It runs here rather than only on the nightly laptop for the reason the jobs above give: a guard
  # that only runs where the drift happens cannot stop the drift from merging. Pure text work
  # against synthetic journals in a temp dir with an isolated -JournalDir / -StateDir /
  # -UserSettings, so it never reads the real planner folder or the user's real settings, and runs
  # unmodified on the Linux runner under pwsh.
  per-task-session:
    name: Per-task session binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (reuse, replace, workspace isolation, concurrency)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-per-task-session.ps1

  # Capacity accounting: does a live session represent work actually IN FLIGHT? The job above
  # guards the LIMIT (binding refusal, release, the in-flight view); this one guards the
  # PREDICATE that decides what the limit counts, and the two are separable -- every bug below
  # left the limit working perfectly and fed it the wrong number.
  #
  # `mutcheck-parked-capacity.ps1` shipped with #487 and has run in CI NOWHERE since. It was a
  # guard against a deadlock that has now recurred three times (#487 awaiting_reply, #500 the doc
  # surface, #541 the `blocked` status), and not one of those recurrences could have been caught
  # by it, because nothing ran it on a pull request. That is #520's shape exactly -- a guard that
  # cannot run reports the same thing as a guard with nothing to do -- and the same
  # merged-and-never-executed class as the reaper-cohort and ps1-encoding guards above.
  #
  # What it pins is an AGREEMENT rather than a behaviour: every status `Test-Workable` calls
  # unworkable must also be uncounted here unless a due timer overrides. The three bugs were all
  # the two readers drifting apart, and the symptom is silent -- #541 measured `6 ELIGIBLE,
  # admits 0`, a run that dispatches nothing and looks idle rather than broken.
  #
  # windows-latest because the harness shells out to `powershell` per fixture, the same as the
  # pacing job below. Pure text work against synthetic state/journal dirs under TEMP, driven
  # through -StateDir/-JournalDir; the live store is never read or written.
  parked-capacity:
    name: Parked-capacity accounting
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (a task waiting on a human holds no dispatch slot)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-parked-capacity.ps1

  # A user's pause must be visible to the DISPATCHER (GH #540). The job above stops a paused task
  # eating the concurrency slot; this one stops the run waking it in the first place. They are the
  # two halves of honouring one instruction, and #541 shipping alone left the pause half-honoured.
  #
  # `session -Id <ID>` answered "does a live session exist?" and never "is that session allowed to
  # work right now?", so a pause typed into a sub-session was invisible on the only path PHASE 1
  # takes. Measured 2026-09-05: two consecutive runs (17:35, 18:05) each read `verdict: reuse,
  # state: live, released: false` and woke a task Shiv had twice asked to pause. Every field they
  # read was accurate -- none of them is about permission -- and on a */30 schedule it repeats
  # until a human notices.
  #
  # The arms pin the DERIVATION rather than a flag: the pause is one recorded fact
  # (`status: blocked|proposed` + `status_by: user`) and `paused` must outrank `reuse`, `create`
  # AND `replace`, while staying reversible by his say-so (#170) and distinct from user-CLOSED.
  #
  # windows-latest to match the sibling capacity jobs; the harness shells out per fixture. Pure
  # text work against synthetic state/journal dirs under TEMP via -StateDir/-JournalDir.
  session-pause:
    name: User pause is visible to dispatch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (a paused task is never woken, created or replaced)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-session-pause.ps1

  # Pacing: how the `Overnight Agent concurrency` tunable (#391) is READ. #404's job above guards
  # its ENFORCEMENT (capacity refusal, release, the in-flight view); this one guards the parse
  # boundary, the argument-over-file precedence, and whether a fallback is visible.
  #
  # It runs in CI because the failure it was written for has no tell. The parse was a leading-
  # integer match, and this settings file's cells are prose that characteristically opens with a
  # date -- so `| Overnight Agent concurrency | 2026-09-02: set to 1 by Shiv |` resolved to 2026.
  # A note about setting it to 1 set it to effectively unbounded, on the one control that stops a
  # run over-committing, in the exact direction the code comment promised was impossible. A run
  # that widened itself by a typo is indistinguishable from one configured that way on purpose.
  #
  # Pure text work against synthetic settings files in a temp dir, driven through -UserSettings
  # and an isolated -StateDir. It never reads the real planner folder and never writes state.
  pacing-concurrency:
    name: Pacing concurrency tunable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (prose never widens, argument outranks the file, fallbacks are visible)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-pacing-concurrency.ps1 -Matrix

  auto-deploy:
    name: Auto-deploy safety and performance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mutation check (safe verdicts, bounded runtime, O(1) history)
        shell: pwsh
        run: ./plugins/overnight-agent/checks/mutcheck-auto-deploy.ps1

  # A shipped PR must not close its issue (GH #428). This job guards the CHECKER; the check
  # itself runs from .github/workflows/pr-closing-keyword.yml, which triggers on the PR events
  # that can change a body or a label without pushing a commit (`edited`, `labeled`,
  # `unlabeled`). Splitting them keeps a one-word description edit from re-running all 15 jobs
  # here, while still re-checking the thing that actually changed.
  #
  # Prose did not hold this rule. Measured over the 40 most recent merged PRs: 15 auto-closed an
  # issue. The decisive case is PR #443, which carried no literal `Closes #N` at all -- it
  # carried a sentence written to promise the opposite:
  # "**This does not close [issue #441](.../issues/441)**". GitHub resolves a closing keyword
  # followed by a markdown LINK by its href, so the disclaimer WAS the closing reference, and
  # issue #441 closed unreviewed two seconds after the merge.
  #
  # Hence the mutation arms below matter in BOTH directions: too narrow lets a real closer
  # merge, too wide makes the job fire on ordinary prose until someone disables it.
  pr-closing-keyword:
    name: PR auto-close guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mutation check (grammar is load-bearing in both directions)
        shell: pwsh
        run: ./plugins/overnight-agent/checks/mutcheck-pr-closing-keyword.ps1

  # `awaiting_reply` -- the fact that decides whether a task is schedulable and what opens the
  # Today->Deferred gate -- was recovered by REGEX from the agent's own narrative closing line
  # (GH #560). The turn's author knew that boolean when it wrote the text; recovering it afterwards
  # means a phrasing choice inside prose written for a human silently decides scheduling.
  #
  # It is a RATCHET, because the agent writes the text its own gate reads: writing a turn parks the
  # task the turn is about. Measured 2026-08-31, 186 of 238 rows parked and ZERO eligible; after the
  # dismissive-opener narrowing, measured 2026-09-06, still only 2 eligible rows out of 249 -- with
  # SKILL.md's own boilerplate `**Your call:** reply below in plain English` present in 81 journals
  # and read back as blocking. The documented template starved the board.
  #
  # This job is in CI for the reason the ps1-encoding and supervisor-liveness jobs above spell out:
  # a guard that only runs on the nightly laptop is a guard that can rot unnoticed. It also has real
  # teeth here -- the fixture is CRLF, and it caught a `(?m)$` anchor that would have made the
  # declaration silently unreadable on every real (CRLF) journal while every hand-written LF test
  # passed.
  #
  # The harness mutates the REAL oa-state.ps1 and write-turn.ps1 rather than a re-implementation of
  # their logic (#463's "green where it was written, broken where it runs"), and works entirely
  # against synthetic journal/state/board files under TEMP via -JournalDir/-StateDir/-PlannerBoard
  # and WRITE_TURN_OA_HOME. No live store is read or written, and it runs under pwsh on Linux.
  declared-ask:
    name: Declared ask, not inferred
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (a declaration outranks the prose, and an undeclared turn is unchanged)
        shell: pwsh
        run: ./plugins/overnight-agent/skills/overnight-agent/mutcheck-declared-ask.ps1

  # A BOM-less .ps1 containing non-ASCII is decoded as Windows-1252 by the PowerShell 5.1
  # engine BEFORE the script runs, so the bytes the parser sees are not the bytes on disk.
  # Comment-only today is not safe tomorrow: the failure is silent, and the same file gaining
  # one non-ASCII string literal or `-match` pattern turns a cosmetic mojibake into a guard
  # that quietly stops matching.
  #
  # mutcheck-ps1-encoding.mjs already existed and CI never ran it -- the same "merged and never
  # once executed" class the reaper-cohort guard hit. Wiring it here is what makes the sweep a
  # guard rather than a report nobody reads.
  #
  # PS1_SWEEP_ROOT is explicit on purpose: the sweep resolves its own root from hard-coded
  # developer checkout paths that do not exist on a runner, and it exits 0 when it cannot find
  # a subject. Without this env the job would pass by scanning nothing.
  ps1-encoding:
    name: PowerShell script encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mutation check (the BOM is detected, not the character)
        run: node ./plugins/overnight-agent/checks/mutcheck-ps1-encoding.mjs
      - name: Every .ps1 carrying non-ASCII is saved UTF-8 with BOM
        run: node ./plugins/overnight-agent/checks/ps1-encoding-sweep.mjs
        env:
          PS1_SWEEP_ROOT: ${{ github.workspace }}

  # Nothing was watching the watchers (GH #261).
  #
  # #261 is "a stuck run freezes the */30 schedule and no timeout fails it". The recovery
  # mechanism for that already exists AND is already running -- measured 2026-09-03:
  # oa-supervisor-daemon pid 18196 and browser-watchdog pid 4144, both launched by Explorer
  # from the Startup folder, because `install-oa-supervisor.ps1` cannot register a scheduled
  # task without elevation and falls back to a Startup shim. A check that queries only
  # Get-ScheduledTask sees neither and concludes the machine is unprotected, which is exactly
  # how this was almost mis-diagnosed.
  #
  # The real gap was that both daemons are UNOBSERVED. The supervisor writes a heartbeat every
  # 15 min, the watchdog logs hourly, and a repo-wide grep found zero readers of either -- while
  # oa-supervisor-daemon.ps1's own header states that if it dies "it stays dead until next
  # logon". So supervision could lapse in silence and #261 would return with no signal.
  #
  # This job is in CI for the reason the ps1-encoding job above spells out: a guard that only
  # runs on the nightly laptop is a guard that can rot. The mutation check drives the real sweep
  # file through its -FactsJson replay path, so it needs no daemon, no scheduled task and no
  # Windows, and runs unmodified here under pwsh.
  supervisor-liveness:
    name: Supervisor liveness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (absent vs dead vs wedged, and healthy stays quiet)
        shell: pwsh
        run: ./plugins/overnight-agent/checks/mutcheck-supervisor-liveness.ps1

  # The OTHER half of GH #261, and the half that actually freezes the schedule.
  #
  # `supervisor-liveness` above proves the daemons are watched. This proves a hung RUN is
  # recovered. stuck-run-sweep already had two arms, and both need proof about the run's
  # OUTCOME - a dead process, or a `session.task_complete` that already fired. #261's own
  # incident had neither: the process was alive and it never finished, so the sweep printed
  # it as `ok` while `running` sat for 9 hours and `nextRunAt` went 8.5h overdue.
  #
  # Arm 3 closes that, and the controls are the point rather than the arm. GH #330 measured
  # real runs of 50 minutes and 2+ hours, so a plain max-runtime would fail healthy work on
  # the largest runs first; arm 3 therefore requires SILENCE as well as age. The test asserts
  # both directions, and keying it on age alone is caught by two dedicated control fixtures.
  #
  # In CI for the reason the two jobs above give: a guard that only runs on the nightly
  # laptop is a guard that can rot. The test builds its own throwaway SQLite fixture, so it
  # needs no app, no daemon and no Windows. Node 22+ for `node:sqlite`.
  stuck-run-recovery:
    name: Stuck run recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A hung run is failed and the schedule is released (and a working one is not)
        run: node ./plugins/overnight-agent/checks/stuck-run-sweep.test.mjs

  # The at-LEAST-one half of "exactly one turn per wake" (GH #476).
  #
  # #473 named one author for a wake and #474/#475 enforced it with write-turn.ps1 G12, which
  # is the at-MOST-one half. It also made that author a single point of failure with no
  # detector: every guard in write-turn.ps1 is a property of a turn BEING WRITTEN, reachable
  # only from the write path, so none of them can fire when nothing is written at all.
  # Measured live on 2026-09-04, task #466: woken 05:36:53, host spawned 05:44:44, host gone
  # by ~06:07, and no branch, no PR, no journal turn and no doc amendment anywhere -- while
  # `scan` still reported an ordinary in-progress row. "Nothing to report" and "never
  # reported" were the same bytes, which is #346's defect on the authorship surface.
  #
  # It runs here rather than only on the nightly laptop for the reason the two jobs above
  # give, and with extra force: a guard for a silent failure that itself fails silently is
  # worse than useless, because it will be believed. The harness therefore asserts an
  # id -> KIND map rather than a fired-set, so a mutation that keeps a finding but relabels
  # it is still caught, and it proves the cannot-measure path exits 2 rather than reporting a
  # clean 0.
  #
  # Pure text work against a synthetic planner folder, state dir and session-state root in a
  # temp dir. PLANNER_PATH, OA_STATE_DIR and OA_SESSION_ROOT are all passed into every child,
  # so nothing depends on LOCALAPPDATA or USERPROFILE and nothing reads the real planner
  # (#425's job went red on exactly that assumption). Liveness is probed with signal 0 on
  # this harness's own pid, which works unmodified on the Linux runner.
  zero-writer-wake:
    name: Zero-writer wake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mutation check (a wake that closed without writing is caught; in-flight stays quiet)
        env:
          OA_SWEEP: ./plugins/overnight-agent/checks/zero-writer-sweep.mjs
        run: node ./plugins/overnight-agent/checks/mutcheck-zero-writer.mjs
  # "Merged" only means "running" if the version moved (GH #448 / #196).
  #
  # There are TWO update mechanisms with two different definitions of "current".
  # `auto-deploy-plugin.ps1` compares FILE CONTENT, copies everything, and truthfully
  # reports `verified-current True`. The watchdog and the CLI compare `plugin.json`'s
  # VERSION, see an unchanged version, and correctly decide there is nothing to do. So a
  # change can be fully deployed by one and completely invisible to the other, and THE
  # BLIND ONE REPORTS SUCCESS. Same shape as #346: a second mechanism silently
  # compensating for a broken first, so "it works" and "it is correct" stop being
  # distinguishable.
  #
  # WHY THIS JOB, WHEN THE DETECTOR ALREADY EXISTED
  # ----------------------------------------------
  # `version-bump-sweep.mjs` and its mutation check both shipped and both work. Neither
  # was wired to anything that blocks. The sweep ran only on the nightly laptop, went
  # FLAGGED, and was skimmed -- measured 2026-09-04 at `244b6e3`: **19 commits and 31
  # files** behind the last bump, including `oa-state.ps1` (the state engine),
  # `write-turn.ps1` (the mandated journal writer, and G12 with it), and both `SKILL.md`
  # contracts. That is `stuck-run-sweep`'s recorded lesson repeating exactly -- it printed
  # a correct warning in 16 consecutive runs and not one acted on it -- and #151, which sat
  # unnoticed for five days on a surface that only logged. A detector nothing gates on
  # accumulates silently, so this gates.
  #
  # WHY IT CAN BE GREEN AT ALL
  # --------------------------
  # Only because the same pull request clears the debt to zero (1.18.0 -> 1.19.0). A gate
  # added on its own would have been red on every unrelated PR from the first day, which is
  # the always-firing detector this repo keeps warning about and switching off. The bump
  # and the gate are one change for that reason, not two.
  #
  # MEASURED, NOT ASSUMED: the PR merge ref is safe here. `actions/checkout` gives the
  # merge commit, whose FIRST parent is the base -- so the obvious worry is that a PR's own
  # bump, sitting on parent 2, is invisible to the sweep's first-parent walk and every PR
  # goes red. It is not: the sweep compares `plugin.json`'s parsed value against the same
  # field in the first parent, so a merge commit that carries the bump IS a bump. Simulated
  # both directions against real merge commits before wiring this -- a bumped PR reads
  # `commits since 0` and exits 0, an unbumped plugin change reads `commits since 1` and
  # exits 1, at the merge ref and at the PR head alike. Hence plain `checkout`, with
  # `fetch-depth: 0` because the sweep walks `plugin.json`'s whole history.
  plugin-version-bump:
    name: Plugin version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The guard first, so a green gate below cannot be a guard that stopped working.
      - name: Mutation check (every guard in the sweep is load-bearing)
        run: node ./plugins/overnight-agent/checks/mutcheck-version-bump.mjs
      - name: Plugin content has not changed since the last version bump
        env:
          OA_PLUGIN_REPO: ${{ github.workspace }}
          # Pinned to HEAD because here the subject IS this pull request. The nightly
          # `run-sweeps.ps1` pins the same sweep to origin/main instead, because there the
          # subject is what is shipped -- and it runs against a working tree nothing
          # updates, which had it reporting a permanently-red wrong number until 2026-09-04.
          OA_PLUGIN_REF: HEAD
        run: node ./plugins/overnight-agent/checks/version-bump-sweep.mjs
  # The supervisor could report HEALTHY while the machine was unusable (GH #403).
  #
  # Every state its classifier could reach was derived from the overnight-agent run slot, so
  # "the app is responsive and runs start on time" was the whole definition of healthy. A
  # process that is responsive AND eating a quarter of the machine satisfied it completely.
  # Measured on shiv-devbox 2026-09-02 while Shiv reported the box unusable: CPU pinned,
  # processor queue length 21 on 4 cores, disk 99% idle -- and the app's own WebView2 tree had
  # burned 7.05 CPU-hours in 14.7 hours of uptime. The supervisor logged HEALTHY / action none
  # throughout, and reached STUCK three times that day while correctly vetoing action, because
  # it had no way to say "this live run is pathologically expensive rather than merely slow".
  #
  # The hard part is not the restart, which already worked; it is defining "leaking" so it
  # cannot fire on a healthy machine under legitimate load. So the arms are the point, and CI
  # runs them: a busy-but-healthy machine must stay quiet, an interactive session must never be
  # restarted merely for being long-lived (#178), and failed sampling must not read as health
  # (#346). The harness mutates the REAL oa-supervisor.ps1 rather than a copy of its logic --
  # unlike the older mutcheck-supervisor.ps1, whose reimplemented classifier can drift from the
  # file that actually ships, which is #463's "green where it was written, broken where it runs".
  #
  # Pure text work: it lifts the two pure functions out of the source and drives them against
  # recorded samples, so there is no database, no app, no daemon and no Windows-only API here.
  supervisor-resource-detector:
    name: Supervisor resource detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation check (a real leak fires; a busy-but-healthy machine stays quiet)
        shell: pwsh
        run: ./plugins/overnight-agent/checks/mutcheck-supervisor-resource.ps1
  # session-state has never been pruned (GH #481).
  #
  # Measured 2026-09-04: 4,120 directories, 2.56 GB, oldest file 27 April, and 500
  # `inuse.<pid>.lock` files of which 477 name a PID that no longer exists while only 23
  # directories are held by a live process. That is unbounded growth in the exact directory
  # `stuck-run-sweep` and `zero-writer-sweep` read to decide whether a session is alive.
  #
  # This job exists because the sweep NAMES DIRECTORIES FOR DELETION. Every other detector in
  # the suite is wrong in the direction of noise; a broken veto here is wrong in the direction
  # of destroying a running session or a task's continuity. So the vetoes are the subject: LIVE
  # (probed with `process.kill(pid, 0)`, never "a lock file exists" -- 477 of 500 locks are
  # dead, so the cheap check would protect essentially nothing while appearing to protect
  # everything), BOUND (the one age CANNOT see: a bound-but-idle session is byte-identical to
  # an abandoned one by mtime, so a by-age pruner silently breaks #404 continuity), and RECENT.
  #
  # It also asserts the floor holds: dry run is the default and `--apply` still refuses.
  # Deleting session history is on the agent gate's "permanent data loss" floor, which outranks
  # this repo's YOLO mode and outranks a human approve.
  #
  # Pure text work against a synthetic session root and state dir in a temp dir; liveness is
  # probed against the harness's own pid, so it runs unmodified on the Linux runner.
  session-state-prune:
    name: Session-state prune vetoes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mutation check (every veto load-bearing; deletion stays unreachable)
        env:
          OA_SWEEP: ./plugins/overnight-agent/checks/session-state-prune-sweep.mjs
        run: node ./plugins/overnight-agent/checks/mutcheck-session-prune.mjs