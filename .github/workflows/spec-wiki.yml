name: Spec wiki

# Regenerates the design specification from the code, the tests and the open
# issues, then publishes it to the GitHub wiki.
#
# WHY IT IS BUILT THIS WAY
# ------------------------
# The bar for this spec is "someone could rebuild the app from it", which rules
# out the obvious implementation (hand the model the repo, ask for a spec). That
# produces fluent prose that drifts from the code immediately and cannot be
# checked, because what is wrong is its relationship to the code -- exactly what
# a reader does not have in front of them.
#
# So the pipeline splits mechanism from policy:
#
#   collect.mjs  (no model)  -> extracts ground-truth facts: module graph,
#                               exports, tests, workflows, open issues.
#   copilot      (model)     -> writes prose FROM those facts, one page at a time
#                               so each page gets a focused slice.
#   verify.mjs   (no model)  -> fails the build if the prose references anything
#                               that does not exist, or omits a domain.
#
# Output lands as a PULL REQUEST, never a direct push: the spec is the design
# authority for the system, so a machine may draft it but a human accepts it.
#
# WIKI PUBLISHING NOTE
# --------------------
# `GITHUB_TOKEN` cannot push to `owner/repo.wiki.git` -- the wiki is a separate
# repository outside the token's scope. The publish job therefore needs a PAT in
# `secrets.WIKI_TOKEN`, and is skipped (not failed) when that secret is absent,
# so the generate-and-review loop works with zero extra setup. The wiki must also
# have been initialised with one page in the UI, or the remote 404s.

on:
  schedule:
    # Weekly, Sunday 09:00 UTC. The spec tracks design, which moves in weeks.
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      publish_wiki:
        description: 'Also publish to the wiki (requires WIKI_TOKEN)'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: read
  # Required for the workflow to make Copilot requests with GITHUB_TOKEN.
  copilot-requests: write

concurrency:
  group: spec-wiki
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and verify spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The spec describes design intent, which lives in commit messages and
          # history as much as in the tree.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect ground-truth facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/spec/collect.mjs --out spec-facts.json

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Generate spec pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/spec
          # --yolo suppresses interactive prompts, required for CI.
          copilot --yolo -p "$(cat scripts/spec/prompt.md)"

      - name: Verify the spec against the code
        run: node scripts/spec/verify.mjs --facts spec-facts.json --dir docs/spec

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The facts file is a build artifact, not source: it is regenerated on
          # every run and would otherwise churn the diff on every commit.
          rm -f spec-facts.json

          if git diff --quiet -- docs/spec; then
            echo "No spec changes: the design has not drifted since the last run."
            exit 0
          fi

          BRANCH="spec/auto-$(date -u +%Y%m%d-%H%M)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/spec
          git commit -m "docs(spec): regenerate design specification from code and issues

          Generated by the Spec wiki workflow. Verified against the collected
          facts: every referenced file and issue exists, and every domain is
          covered.

          Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "docs(spec): regenerate design specification" \
            --body "Automated regeneration of the design spec in \`docs/spec\`.

          This is the source of truth that is mirrored to the wiki. It was written
          from \`spec-facts.json\` (module graph, exports, tests, workflows, open
          issues) and passed \`scripts/spec/verify.mjs\`, which fails on any
          reference to a file or issue that does not exist and on any uncovered
          domain.

          **Review for judgement, not for facts** -- the structural claims are
          machine-checked; what needs a human is whether the design rationale is
          right." \
            --base main

      - name: Upload facts as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-facts
          path: spec-facts.json
          if-no-files-found: ignore

  publish-wiki:
    name: Publish to wiki
    needs: generate
    runs-on: ubuntu-latest
    # Only publishes what is already on main and reviewed. Skipped entirely when
    # no PAT is configured, because GITHUB_TOKEN cannot push to a wiki repo.
    if: github.event_name == 'schedule' || inputs.publish_wiki
    steps:
      - uses: actions/checkout@v4

      - name: Publish docs/spec to the wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WIKI_TOKEN:-}" ]; then
            echo "::notice::WIKI_TOKEN not set - skipping wiki publish."
            echo "GITHUB_TOKEN cannot push to owner/repo.wiki.git, so a PAT with"
            echo "repo scope is required. docs/spec on main remains the source of truth."
            exit 0
          fi
          if [ ! -d docs/spec ]; then
            echo "::notice::docs/spec does not exist yet - nothing to publish."
            exit 0
          fi

          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki || {
            echo "::error::Could not clone the wiki. It must be initialised with one page in the UI first."
            exit 1
          }

          # Mirror, so a page deleted from docs/spec disappears from the wiki too
          # rather than lingering as a stale page nobody can trace to a source.
          find wiki -maxdepth 1 -name '*.md' -delete
          cp docs/spec/*.md wiki/

          cd wiki
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Wiki already matches docs/spec."
            exit 0
          fi
          git add -A
          git commit -m "docs(spec): sync from docs/spec @ ${GITHUB_SHA}"
          git push
