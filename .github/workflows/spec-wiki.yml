name: Spec wiki

on:
  schedule:
    - cron: '17 16 * * *' # One daily opportunity to propose; state also enforces a rolling 24h limit.
    - cron: '17 0-15,17-23 * * *' # Approval/publication only; never generates another review.
  workflow_dispatch:
    inputs:
      propose:
        description: 'Check for a new review (still subject to pending-review and 24-hour gates)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spec-wiki
  cancel-in-progress: false

jobs:
  prepare:
    name: Read review gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    outputs:
      generate: ${{ steps.gate.outputs.generate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check document, pending revision, and daily limit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_ALLOW_PROPOSAL: ${{ github.event.schedule == '17 16 * * *' || inputs.propose }}
          WIKI_REVIEW_DOC_ID: ${{ vars.WIKI_REVIEW_DOC_ID }}
          WIKI_APPROVER_EMAIL: ${{ vars.WIKI_APPROVER_EMAIL }}
          WIKI_GOOGLE_CLIENT_ID: ${{ secrets.WIKI_GOOGLE_CLIENT_ID }}
          WIKI_GOOGLE_CLIENT_SECRET: ${{ secrets.WIKI_GOOGLE_CLIENT_SECRET }}
          WIKI_GOOGLE_REFRESH_TOKEN: ${{ secrets.WIKI_GOOGLE_REFRESH_TOKEN }}
        run: node scripts/spec/reviewCli.mjs prepare
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.generate == 'true'
        with:
          name: wiki-review-ticket
          path: .wiki-review-ticket.json
          include-hidden-files: true
          if-no-files-found: error

  generate:
    name: Draft affected pages
    needs: prepare
    if: needs.prepare.outputs.generate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: wiki-review-ticket
      - run: npm install -g @github/copilot
      - name: Collect current facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/spec/collect.mjs --out spec-facts.json
      - name: Draft using the accepted policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: copilot --yolo -p "$(cat scripts/spec/prompt.md)"
      - uses: actions/upload-artifact@v4
        with:
          name: wiki-candidate-pages
          path: docs/spec/*.md
          if-no-files-found: error

  verify-spec-branch:
    name: Verify frozen candidate
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # Fresh trusted checkout: model-produced scripts or instructions never reach
      # a job with document credentials or repository write permission.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: wiki-candidate-pages
          path: docs/spec
      - run: npm ci
      - name: Collect trusted facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/spec/collect.mjs --out spec-facts.json
      - name: Verify page facts and readability
        run: node scripts/spec/verify.mjs --facts spec-facts.json --dir docs/spec
      - name: Unit tests
        id: test
        run: npm test
      - name: Production build
        id: build
        if: always()
        run: npm run build
      - name: Lint
        id: lint
        if: always()
        run: npm run lint

  stage-review:
    name: Freeze and present the review
    needs: [prepare, verify-spec-branch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: wiki-review-ticket
      - uses: actions/download-artifact@v4
        with:
          name: wiki-candidate-pages
          path: docs/spec
      - name: Save immutable snapshot and append the review
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_REVIEW_DOC_ID: ${{ vars.WIKI_REVIEW_DOC_ID }}
          WIKI_APPROVER_EMAIL: ${{ vars.WIKI_APPROVER_EMAIL }}
          WIKI_GOOGLE_CLIENT_ID: ${{ secrets.WIKI_GOOGLE_CLIENT_ID }}
          WIKI_GOOGLE_CLIENT_SECRET: ${{ secrets.WIKI_GOOGLE_CLIENT_SECRET }}
          WIKI_GOOGLE_REFRESH_TOKEN: ${{ secrets.WIKI_GOOGLE_REFRESH_TOKEN }}
        run: node scripts/spec/reviewCli.mjs stage

  publish-wiki:
    name: Publish only an approved snapshot
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check approval, write accepted source, publish, and verify remote bytes
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          WIKI_REVIEW_DOC_ID: ${{ vars.WIKI_REVIEW_DOC_ID }}
          WIKI_APPROVER_EMAIL: ${{ vars.WIKI_APPROVER_EMAIL }}
          WIKI_GOOGLE_CLIENT_ID: ${{ secrets.WIKI_GOOGLE_CLIENT_ID }}
          WIKI_GOOGLE_CLIENT_SECRET: ${{ secrets.WIKI_GOOGLE_CLIENT_SECRET }}
          WIKI_GOOGLE_REFRESH_TOKEN: ${{ secrets.WIKI_GOOGLE_REFRESH_TOKEN }}
        run: node scripts/spec/reviewCli.mjs publish
